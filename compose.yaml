# Server job control dashboard: MQTT broker + backend API + UI, on one server (COMPOSE_PROFILES=hub).
# The per-server agents that publish to the broker live in the services repo
# (server-job-control-services-idrac-gpu-fans-power, services/sjc-agent).
# All services restart on their own (restart: unless-stopped) and come back when Docker starts at boot.
name: sjc

services:
  mosquitto:
    profiles: [hub]
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports: ["${SJC_MQTT_PUBLISH:-1883}:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  backend:
    profiles: [hub]
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    depends_on: [mosquitto]
    environment:
      SJC_MQTT_HOST: mosquitto
      SJC_LEGACY_API: ${SJC_LEGACY_API:-}
      SJC_CONTROL_NETS: ${SJC_CONTROL_NETS:-127.,10.,172.,192.168.}
      SJC_SITE_FILE: /site/site.json
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      UI_BASE_PATH: ${UI_BASE_PATH:-/}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LOGIN: ${LOGIN:-off}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    volumes:
      - ./deploy/local:/site:ro   # private site.json (machine names, roles); missing = generic names

  ui:
    profiles: [hub]
    build: { context: ui }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${SJC_UI_PORT:-8100}:80"]
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      UI_BASE_PATH: ${UI_BASE_PATH:-/}   # must start and end with /


volumes:
  mosquitto-data:
