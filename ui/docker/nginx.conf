# nginx image template (/etc/nginx/templates): ${FRAME_ANCESTORS}, ${UI_BASE_PATH}, ${UI_LISTEN} and ${BACKEND_URL} are filled
# from the environment at start (compose.yaml sets them; deploy/compose.hub.yaml switches to host networking).
# UI_BASE_PATH (e.g. /recovery/) becomes index.html's <base href>, and requests under that prefix are served as if at /.
server {
    listen ${UI_LISTEN};   # an IPv4 address:port or a port (nginx "listen <port>" is IPv4 only)
    root /usr/share/nginx/html;
    rewrite ^${UI_BASE_PATH}(.*)$ /$1 last;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix ${UI_BASE_PATH};
        proxy_read_timeout 30s;
    }
    location = /healthz { proxy_pass ${BACKEND_URL}; }

    # hashed bundles cache forever; index.html never (so a redeploy shows at once)
    location ~* \.(js|css|woff2?|ico|svg|png)$ {
        expires max;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' ${FRAME_ANCESTORS}" always;
        sub_filter '<base href="/">' '<base href="${UI_BASE_PATH}">';
        sub_filter_once on;
        try_files $uri /index.html;
    }
}
